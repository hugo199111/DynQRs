name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [openfollow-windows]
    paths:
      - "openfollow/**"
      - ".github/workflows/build-openfollow-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Cache verified native dependency build
        uses: actions/cache/restore@v6
        with:
          path: C:\of-build\native-build
          key: windows-2022-py313-gvs2026.8-${{ hashFiles('openfollow/packaging/windows/build_native.py', 'openfollow/packaging/windows/Build-Windows.ps1') }}-${{ github.run_id }}
          restore-keys: |
            windows-2022-py313-gvs2026.8-${{ hashFiles('openfollow/packaging/windows/build_native.py', 'openfollow/packaging/windows/Build-Windows.ps1') }}-
            windows-2022-py313-gvs2026.8-d542d7d2ae5d7835708d2ae87331f5ac38593b368b25a24b4f7e0b096d60d815-
      - name: Build native Windows package
        id: native_build
        shell: pwsh
        run: |
          try {
            $MsysOutput = & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm patch' 2>&1
            $MsysStatus = $LASTEXITCODE
            $MsysOutput | Write-Output
            if ($MsysStatus -ne 0) { throw "MSYS2 dependency installation failed: $($MsysOutput | Out-String)" }
            & .\openfollow\packaging\windows\Build-Windows.ps1 -BuildRoot C:\of-build -PythonExecutable (Get-Command python).Source
          } catch {
            $Summary = ($_ | Out-String).Trim()
            if ($Summary.Length -gt 10000) { $Summary = $Summary.Substring($Summary.Length - 10000) }
            $Annotation = $Summary.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows compilation error::$Annotation"
            throw
          }
      - name: Retain native dependencies after build attempts
        if: ${{ always() && (steps.native_build.outcome == 'success' || steps.native_build.outcome == 'failure') }}
        uses: actions/cache/save@v6
        with:
          path: C:\of-build\native-build
          key: windows-2022-py313-gvs2026.8-${{ hashFiles('openfollow/packaging/windows/build_native.py', 'openfollow/packaging/windows/Build-Windows.ps1') }}-${{ github.run_id }}
      - name: Upload build and verification results
        uses: actions/upload-artifact@v7
        with:
          name: OpenFollow-Windows-x64
          path: |
            C:\of-build\dist\OpenFollow-Windows-x64.zip
            C:\of-build\dist\OpenFollow-running.png
            C:\of-build\self-check.json
          if-no-files-found: error
      - name: Upload corresponding application source
        uses: actions/upload-artifact@v7
        with:
          name: OpenFollow-Windows-source
          path: openfollow
